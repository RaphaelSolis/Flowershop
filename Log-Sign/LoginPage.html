<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Petal Haus | Log In</title>
    <link rel="stylesheet" href="style.css?v=20261119-responsive-layout" />
    <script src="../settings.js?v=20261122-instructions-final" defer></script>
    <script src="../products.js?v=20261122-instructions-final" defer></script>
    <script src="../store.js?v=20261122-instructions-final" defer></script>
    <script src="../account.js?v=20261119-account-delivery" defer></script>
  </head>

  <body>
    <div class="wrapper">
      <img
        class="photo"
        src="BG.jpg"
        alt="Flower shop"
        width="440"
        height="580"
      />
      <a href="../index.html" class="logo-link" aria-label="The Petal Haus home"><img
        class="logo"
        src="logo.png"
        alt="The Petal Haus"
        width="280"
        height="280"
      /></a>
      <div class="card">
        <h1>LOG IN</h1>
        <p class="intro">
          We are delighted to meet you! Please login or register to continue.
        </p>
        <p id="account-status" role="status"></p>
        <form method="POST" action="../index.html">
          <label for="account-email">Email:</label>
          <input
            autocomplete="email"
            id="account-email"
            class="field"
            type="email"
            name="email"
            required
          />
          <label for="account-password">Password:</label>
          <div class="password-field"><input
            autocomplete="current-password"
            id="account-password"
            class="field"
            type="password"
            name="password"
            required
          /><button class="password-toggle" type="button" data-password-toggle="account-password" aria-controls="account-password" aria-label="Show password" aria-pressed="false" title="Show password"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></div>
          <a class="forgot" href="#">Forgotten Password?</a>
          <input class="button" type="submit" value="LOG IN" />
        </form>
        <p class="signup">
          Don't have an account here?
          <a href="SignUp.html">Sign up here.</a>
        </p>
      </div>
    </div>
  </body>
</html>
